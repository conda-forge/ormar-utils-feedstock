context:
  version: "0.2.1"

package:
  name: ormar-utils
  version: ${{ version }}

source:
  url: https://github.com/ormar-orm/ormar-utils/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 11f363f301e9635ee97d8b7f768032c8b137890390073db3645a2cc812b1e467

build:
  number: 1
  script:
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - python -m pip install . -vv


requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    - maturin >=1.0,<2.0
  run:
    - python

tests:
  - python:
      imports:
        - ormar_rust_utils
      pip_check: true

about:
  homepage: https://github.com/ormar-orm/ormar-utils
  summary: 'Rust-accelerated utility functions for the ormar async ORM.'
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - thewchan
